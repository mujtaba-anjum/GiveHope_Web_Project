<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NGO Home | GiveHope</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" href="ngo-home.html">GiveHope</a>
            <a href="index.html" class="btn btn-outline-secondary btn-sm">Logout</a>
        </div>
    </nav>

    <div class="page-title">
        <div class="container">
            <h3 class="mb-0">NGO Home</h3>
        </div>
    </div>

    <div class="container">

        <div class="box mb-4">
            <h5>My Campaigns</h5>
            <table class="table">
                <thead>
                    <tr>
                        <th>Campaign</th>
                        <th>Target</th>
                        <th>Raised</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>School Fees for Children</td>
                        <td>Rs. 50,000</td>
                        <td>Rs. 30,000</td>
                        <td>Active</td>
                    </tr>
                    <tr>
                        <td>Books for Library</td>
                        <td>Rs. 20,000</td>
                        <td>Rs. 0</td>
                        <td>Pending</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="box">
            <h5 class="mb-3">Create New Campaign</h5>

            <div class="mb-3">
                <label class="form-label">Title</label>
                <input type="text" class="form-control" placeholder="Campaign title">
            </div>

            <div class="mb-3">
                <label class="form-label">Target Amount (Rs.)</label>
                <input type="number" class="form-control" placeholder="e.g. 50000">
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea class="form-control" rows="3" placeholder="Write a short description"></textarea>
            </div>

            <a href="#" class="btn btn-soft">Create Campaign</a>
        </div>

    </div>

    <footer>
        <p class="mb-0">&copy; 2026 GiveHope</p>
    </footer>

</body>
</html>
