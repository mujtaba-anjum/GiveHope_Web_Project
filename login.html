<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | GiveHope</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" href="index.html">GiveHope</a>
            <div>
                <a href="login.html" class="btn btn-outline-secondary btn-sm">Login</a>
                <a href="signup.html" class="btn btn-soft btn-sm">Sign Up</a>
            </div>
        </div>
    </nav>

    <div class="box form-box">
        <h3 class="text-center mb-4">Login</h3>

        <form>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" placeholder="Enter your email" required>
            </div>

            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" placeholder="Enter your password" required>
            </div>

            <button type="submit" formaction="donor-home.html" class="btn btn-soft w-100 mb-2">Login as Donor</button>
            <button type="submit" formaction="ngo-home.html" class="btn btn-peach w-100 mb-2">Login as NGO</button>

            <a href="admin-login.html" class="btn btn-outline-secondary w-100">Login as Admin</a>
        </form>

        <p class="text-center small mt-4 mb-0">
            New here? <a href="signup.html">Sign Up</a>
        </p>
    </div>

    <footer>
        <p class="mb-0">&copy; 2026 GiveHope</p>
    </footer>

</body>
</html>
